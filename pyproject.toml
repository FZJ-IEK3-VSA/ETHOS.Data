[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethos_data"
dynamic = ["version"]
description = "Shared, deduplicating data access for ETHOS tools and workflows"
authors = [
    { name = "Julian belina", email = "j.belina@fz-juelich.de" }
]
readme = "README.md"
# 3.10 is the floor because the package writes its own text files with an
# explicit encoding *and* an explicit newline -- `Path.write_text(newline=...)`
# arrived in 3.10 -- and because `entry_points().select()` replaced the mapping
# form the collections lookup used to have to branch on.
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pooch>=1.8.0",
  "pyyaml>=5.4",
  "platformdirs>=3.0",   # cross-platform config and cache locations
]

[project.optional-dependencies]
progress = ["tqdm"]
# Documentation toolchain, for `pip install -e ".[docs]"` and the Read the Docs
# build (.readthedocs.yaml). Mirrors the MkDocs block in environment.yml; a floor
# raised in one place must be raised in the other, or the hosted site and a
# developer's local preview render with different versions.
docs = [
  "mkdocs>=1.6,<1.7",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.25",
  "mkdocstrings-python>=1.10",
  "griffe>=0.45",
  # mkdocstrings formats the separated signatures with Ruff (or Black) when one
  # is importable and otherwise prints them on one line. environment.yml has
  # ruff as the linter, so without it here the hosted API pages would not match
  # a developer's preview.
  "ruff",
]

[project.scripts]
# One executable. The maintainer commands are `ethos-data catalog ...`; they need
# no extra Python dependencies -- only `rclone` and `oidc-agent` on PATH, and
# only for `upload` / `check-store` -- so there is no install extra to gate them.
# There was a second entry point, `ice2-catalog`, until the two were unified.
ethos-data = "ethos_data.cli:main"

[tool.hatch.version]
# One source for the version: ethos_data.__version__. With a second copy here,
# the installed metadata and the imported package could disagree silently.
path = "src/ethos_data/__init__.py"

[tool.hatch.build.targets.wheel]
# Hatchling ships every non-ignored file under the package directory, so the
# maintainer scripts (maintain/scripts/*.sh) need no package-data entry.
packages = ["src/ethos_data"]

[tool.hatch.build.targets.sdist]
# Without this the sdist takes everything .gitignore does not exclude -- docs,
# local fonts, diagram sources. Source and tests are what a rebuild needs, and
# the licence, which has to travel with any copy of the source.
include = ["/src", "/tests", "/LICENSE"]
