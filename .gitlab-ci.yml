# GitLab Pages job for the MkDocs documentation.
#
# `site_url` in mkdocs.yml reads CI_PAGES_URL, which GitLab sets to the real
# per-project Pages URL -- so the canonical links and the 404 page's
# root-absolute asset paths are correct without hardcoding a host here.
#
# --strict turns MkDocs warnings into errors. That is deliberate: a broken
# internal link or a mkdocstrings identifier that no longer resolves should
# fail the build, not ship as a dead link.

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.docs_env: &docs_env
  image: python:3.12
  before_script:
    # mkdocstrings imports nothing at build time, but griffe resolves the
    # package from `paths: [src]`, so the source tree is all it needs. The
    # editable install is still worth it: it fails early if the package is
    # broken, before a full docs build.
    - pip install -e .
    - pip install "mkdocs>=1.6,<1.7" "mkdocs-material>=9.5" "mkdocstrings>=0.25" "mkdocstrings-python>=1.10"

docs:
  <<: *docs_env
  stage: test
  script:
    - mkdocs build --strict
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  <<: *docs_env
  stage: deploy
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
