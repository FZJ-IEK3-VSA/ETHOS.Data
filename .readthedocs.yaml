# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This site is plain MkDocs over committed diagram SVGs, so unlike the sibling
# ETHOS repositories (GLAES, RESKit) it needs neither a conda environment nor a
# notebook-execution step: a pip install of this package with its `docs` extra
# is the whole toolchain. environment.yml stays the developer setup -- it also
# carries rclone and the LaTeX diagram renderer, which a docs build never uses.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        # Read the Docs' own MkDocs invocation does not pass --strict, so a
        # broken cross-reference would publish silently. contributing.md asks
        # for a strict build before every commit; the hosted build holds the
        # same line and fails instead.
        - mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

python:
  install:
    # mkdocstrings imports ethos_data to render the API reference, so the
    # package itself has to be installed, not only its documentation tools.
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
