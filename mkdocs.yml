          - Installation: installation.md
          - Glossary: reference/glossary.md
          - Contributing: contributing.md
          - Legal Notice: legal-notice.md

    # Lessons only. A page that gets one real task done belongs under How-to
    # guides even when it is written for newcomers; see contributing.md.
