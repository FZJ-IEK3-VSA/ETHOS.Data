# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: ETHOS.Data
site_description: Shared, deduplicating data access for ETHOS tools and workflows
site_author: ICE-2 Jülich Systems Analysis

# The canonical URL is whatever the host serves this from. Read the Docs sets
# READTHEDOCS_CANONICAL_URL per version (.../en/latest/, .../en/stable/), so
# every version's pages point at themselves rather than all at one; GitLab CI
# sets CI_PAGES_URL for a Pages job; SITE_URL is the manual override that beats
# both. The localhost default keeps `mkdocs serve` honest -- an absolute
# site_url baked in from somebody's laptop makes every <link rel="canonical">
# and the 404 page's root-absolute asset paths point at a host that does not
# serve this site.
site_url: !ENV [SITE_URL, READTHEDOCS_CANONICAL_URL, CI_PAGES_URL, "http://localhost:8000/"]

repo_url: https://github.com/FZJ-IEK3-VSA/ETHOS.Data
repo_name: FZJ-IEK3-VSA/ETHOS.Data
edit_uri: edit/main/docs/

# NOTE: no `copyright:` key, deliberately. docs/overrides/partials/copyright.html
# renders config.copyright as a plain line ABOVE the institutional logo band, so
# setting it puts a stray "Forschungszentrum Julich GmbH, ICE-2" on its own above
# a footer that already names the institute in full underneath the logos. TSAM
# and GLAES leave it unset for the same reason; the partial keeps the `{% if %}`
# only so a project that wants a real copyright line can still set one.

docs_dir: docs
site_dir: site

validation:
    links:
        anchors: warn
        absolute_links: warn
        unrecognized_links: warn

theme:
    name: material
    custom_dir: docs/overrides
    # No `logo:` or `favicon:` yet: the ETHOS.Data mark in docs/branding/ is a
    # proposal with no rendered assets, and a path to a file that does not exist
    # shows a broken image in every page header. See contributing.md#logo.
    font:
        text: Roboto
        code: Roboto Mono
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.path
        - navigation.tracking
        - content.code.copy
        - content.code.annotate
        - content.tabs.link
        - content.action.edit
        - content.tooltips
        - search.suggest
        - search.highlight
        - search.share
        - toc.follow
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

plugins:
    - search

    - mkdocstrings:
          default_handler: python
          handlers:
              python:
                  paths: [src]
                  options:
                      show_source: true
                      show_root_heading: true
                      members_order: source
                      # The docstrings here carry no formal section headers, so
                      # a pinned style would make griffe warn on every one of
                      # them. `auto` detects per docstring and stays quiet.
                      docstring_style: auto
                      docstring_section_style: table
                      summary: true
                      show_symbol_type_heading: true
                      show_symbol_type_toc: true
                      separate_signature: true
                      show_signature_annotations: true
                      signature_crossrefs: true
                      merge_init_into_class: true
                      show_bases: true

markdown_extensions:
    - admonition
    - attr_list
    - abbr
    - def_list
    - footnotes
    - md_in_html
    - tables
    - pymdownx.details
    - pymdownx.inlinehilite
    - pymdownx.mark
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
    # No mermaid custom_fence: diagrams are TikZ, rendered to committed SVGs by
    # docs/diagrams/render.py. superfences is still needed for nested fences
    # inside admonitions and tabs.
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.snippets:
          base_path: ['.']
    - toc:
          permalink: true
          toc_depth: 4

# Under docs/ but not documentation, so not copied into the built site:
#   overrides/  Material theme template source (see theme.custom_dir)
#   diagrams/   TikZ sources and the render script. The rendered SVGs they
#               produce live in assets/diagrams/ and ARE published; the .tex
#               and the renderer are edit-time tooling.
#   branding/   Logo proposal and renderer; exports go to assets/branding/
#               once the logo is adopted (none exist yet).
#   font/       Local font files and design references, used only for rendering.
# The leading slash anchors to the docs root. Without it, gitignore semantics
# match a directory of that name at ANY depth -- and `diagrams/` then also
# excluded assets/diagrams/, i.e. the rendered SVGs the pages actually embed.
exclude_docs: |
  /overrides/
  /diagrams/
  /branding/
  /font/

# Compatibility pages retain previously shared architecture URLs.
not_in_nav: |
  /explanation/architecture/lifecycle.md
  /explanation/architecture/quality-and-risks.md

extra:
    generator: false

extra_css:
    - stylesheets/extra.css

