name: ethos_data_env
channels:
  - conda-forge
dependencies:
  - python >=3.10
  - pooch
  - pyyaml
  - platformdirs
  - tqdm
  - rclone
  # oidc-agent is deliberately NOT listed, because conda-forge skips it on
  # Windows -- upstream builds the CLI there only against the MSYS2 POSIX
  # runtime and recommends WSL instead -- and an environment.yml has no
  # per-platform selectors, so naming it here makes `mamba env create` fail
  # outright on Windows rather than just omitting it.
  #
  # Only `ethos-data catalog upload` and `catalog check-store` need it, and both
  # want it on PATH rather than importable. Install it alongside:
  #     mamba install -n <env> oidc-agent      # Linux and macOS
  # On Windows, run those two commands from WSL. Everything else in the package
  # -- the whole read side, and `catalog build` / `publish` -- works without it.
  # dev
  - pytest
  - ruff
  # Diagram toolchain. The docs reference committed SVGs, so these are needed
  # only to re-render a diagram after editing its .tex source -- an ordinary
  # `mkdocs build` needs neither. docs/diagrams/render.py drives them:
  #   tectonic  TikZ -> PDF. Fetches the LaTeX packages it needs on demand,
  #             which a system TeX Live install often cannot (no standalone,
  #             no preview, no arrows.meta).
  #   poppler   provides pdftocairo, for PDF -> SVG.
  - tectonic
  - poppler
  # Documentation (MkDocs). `mkdocs serve` for a live preview, `mkdocs build`
  # for the static site. mkdocstrings needs ethos_data importable, so install
  # the package into this environment (`pip install -e . --no-deps`) before
  # building the API reference pages.
  - mkdocs >=1.6,<1.7
  - mkdocs-material >=9.5
  - mkdocstrings >=0.25
  - mkdocstrings-python >=1.10
  - griffe >=0.45

